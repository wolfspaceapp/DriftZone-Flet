name: Build APK & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build APK
        run: |
          flet build apk --verbose --yes --no-rich-output
        env:
          FLET_CLI_NO_RICH_OUTPUT: "1"

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find build -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          if [ -z "$APK_PATH" ]; then
            echo "No APK found!" >&2
            exit 1
          fi
          cp "$APK_PATH" "DriftZone.apk"
          echo "path=DriftZone.apk" >> "$GITHUB_OUTPUT"

      - name: Create Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: DriftZone APK (build ${{ github.run_number }})
          body: |
            APK compilado automáticamente desde el commit ${{ github.sha }}.
            Descarga el archivo `DriftZone.apk` de abajo e instálalo en tu dispositivo Android.
          files: ${{ steps.apk.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
